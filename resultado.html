<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pagina-titulo">Detalle del Proyecto | USMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos/estilorel.css">
    <style>
        /* Estilos de la ficha de detalle */
        .detalle-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--color-primary, #9b111e);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }
        .btn-volver:hover {
            color: var(--color-primary-hover, #7b0d18);
            text-decoration: underline;
        }

        .detalle-card {
            background: var(--bg-surface, #fff);
            border: 1px solid var(--border-light, #e2e8f0);
            border-radius: var(--radius-lg, 16px);
            overflow: hidden;
            box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.06));
        }

        .detalle-header {
            padding: 1.75rem 2rem 1rem;
        }

        .detalle-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.3;
            margin: 0.75rem 0 0.5rem;
            color: var(--text-main, #0f172a);
        }

        .imagen-principal {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            display: block;
        }

        .panel-autores {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            background: #f8fafc;
            border-top: 1px solid var(--border-light, #e2e8f0);
            border-bottom: 1px solid var(--border-light, #e2e8f0);
            padding: 1rem 2rem;
            font-size: 0.9rem;
        }
        .panel-autores span {
            display: block;
            color: var(--text-subtle, #94a3b8);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.15rem;
        }
        .panel-autores strong {
            color: var(--text-main, #0f172a);
        }

        .seccion-detalle {
            padding: 1.5rem 2rem;
        }
        .seccion-detalle h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: var(--text-main, #0f172a);
        }
        .seccion-detalle p {
            color: var(--text-muted, #475569);
            line-height: 1.65;
            font-size: 0.95rem;
        }

        .galeria-secundaria {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.75rem;
        }
        .galeria-secundaria img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid var(--border-light, #e2e8f0);
        }

        .acciones-descarga {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            padding: 1.5rem 2rem 2rem;
            border-top: 1px solid var(--border-light, #e2e8f0);
        }

        .boton-secundario-link {
            color: var(--color-primary, #9b111e);
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .boton-secundario-link:hover {
            text-decoration: underline;
        }

        .logo-link {
            font-weight: 700;
            color: var(--text-main, #0f172a);
            text-decoration: none;
            font-size: 1.05rem;
        }
        .logo-link:hover {
            color: var(--color-primary, #9b111e);
        }

        @media (max-width: 640px) {
            .detalle-header h1 { font-size: 1.3rem; }
            .galeria-secundaria { grid-template-columns: 1fr; }
            .panel-autores { flex-direction: column; gap: 0.75rem; }
        }
    </style>
</head>
<body>

    <header class="buscador-wrapper">
        <div class="buscador-container">
            <a href="parte 2,1.html" class="logo-link">
                ← Portal de Proyectos USMP
            </a>
        </div>
    </header>

    <div class="detalle-container">
        <a href="parte 2,1.html" class="btn-volver">&larr; Volver a los resultados de búsqueda</a>

        <article class="detalle-card" id="contenedor-proyecto">
            <!-- Contenido dinámico -->
        </article>
    </div>

        const urlParams = new URLSearchParams(window.location.search);
        const proyectoId = urlParams.get('id') || "1";
        const data = proyectos[proyectoId];
        const contenedor = document.getElementById('contenedor-proyecto');

        if (data) {
